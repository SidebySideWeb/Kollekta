<img alt="Garment Detail" class="w-full h-auto max-h-full object-contain rounded-lg shadow-2xl transition-transform duration-300 ease-out" data-alt="A high-resolution, full-screen fashion studio shot of a high-end luxury garment. The lighting is precise, dramatic, and creates a moody, minimalist aesthetic. The background is a stark, deep black to emphasize the textures and tailoring of the piece. The overall mood is sophisticated and technical, typical of premium wholesale catalogs." id="lightbox-image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4muv2NmFsjFzGX1tZmTf_mhVRqzZ1CwQp2N9c56hjIbV_6691A5R-KAvSWa5ekGWpWgMlh2jEmKrD_jdpbqf8wOMvTu1T1JRRG2_9-iLN_VoVxq40_V-AKWAipMb2B5tJEbxjWSr9yIJ-CB-5XA04XLNoyBSU0t4a-NzkrcCAqfXBpYPp4IWZtF68Yu_ekCNPLzvF5bI8WusWbuBCJhgB7tK6LnLj0y8o-NPH3RA7QgL9i9FuXvOI"/>
</div>

<!-- Top Left: Meta Info -->

<span class="material-symbols-outlined text-2xl group-hover:rotate-90 transition-transform duration-200">close</span>
</button>
</div>
<!-- Middle Area: Navigation Chevrons -->
<div class="absolute inset-y-0 left-0 w-24 flex items-center justify-start pl-4 z-20 pointer-events-none">
<button aria-label="Previous image" class="pointer-events-auto w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low/20 backdrop-blur-sm text-on-surface-variant hover:text-primary hover:bg-surface-container-high/80 border border-transparent hover:border-outline-variant/50 transition-all active:scale-90">

</button>

<span class="material-symbols-outlined">check</span>
                Επιλογή
            </button>
</div>
</main>
<script>
        // Simple pinch-to-zoom simulation hint (visual only for this prototype)
        const img = document.getElementById('lightbox-image');
        let scale = 1;
        
        img.addEventListener('dblclick', () => {
            scale = scale === 1 ? 1.5 : 1;
            img.style.transform = `scale(${scale})`;
            if(scale > 1) {
                img.style.cursor = 'zoom-out';
            } else {
                img.style.cursor = 'zoom-in';
            }
        });
    </script>
