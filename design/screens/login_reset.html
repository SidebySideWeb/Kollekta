<!DOCTYPE html>

<html class="dark" lang="el"><head>

<!-- Material Symbols -->

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<!-- Tailwind CSS -->

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {

                        "tertiary-container": "#b9890a",
                        "primary-fixed": "#e5deff",
                        "background": "#131319",
                        "on-tertiary-container": "#382700",
                        "surface-tint": "#c8bfff",
                        "surface-variant": "#34343b",
                        "tertiary": "#f5be46",
                        "secondary-container": "#494851",

                    "spacing": {

                    },
                    "fontFamily": {

                        "display-lg": ["Hanken Grotesk", "sans-serif"],
                        "body-lg": ["Hanken Grotesk", "sans-serif"],

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary">
<!-- 
        Navigation Shell suppressed as per Semantic Shell Mandate:
        "Linear/Transactional: Login, Sign-up, Onboarding... MUST exclude the navigation shell"
    -->
<main class="flex-grow flex items-center justify-center p-gutter md:p-container-margin py-safe-area-top pb-safe-area-bottom">
<div class="w-full max-w-[1200px] grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-24">
<!-- SCREEN 1: LOGIN STATE -->
<section class="flex flex-col items-center justify-center w-full max-w-[440px] mx-auto bg-surface-container p-8 md:p-12 rounded-lg border border-outline-variant shadow-2xl shadow-black/50">
<!-- Logo & Brand -->
<div class="flex flex-col items-center mb-10">
<svg class="w-12 h-12 text-on-background mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<h1 class="font-headline-md text-headline-md tracking-tight text-center">LUMIÈRE WHOLESALE</h1>
</div>
<!-- Login Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="font-body-md text-body-md text-on-surface-variant block" for="phone">Κινητό τηλέφωνο</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
<span class="material-symbols-outlined" style="font-size: 20px;">phone_iphone</span>
</span>
<input class="w-full min-h-touch-target-min bg-surface-dim border border-outline-variant rounded-DEFAULT pl-11 pr-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="phone" inputmode="numeric" placeholder="69..." required="" type="tel"/>
</div>
</div>
<div class="space-y-2">
<label class="font-body-md text-body-md text-on-surface-variant block" for="password">Κωδικός πρόσβασης</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
<span class="material-symbols-outlined" style="font-size: 20px;">lock</span>
</span>
<input class="w-full min-h-touch-target-min bg-surface-dim border border-outline-variant rounded-DEFAULT pl-11 pr-4 py-3 font-code-md text-code-md uppercase tracking-widest text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline placeholder:normal-case placeholder:tracking-normal" id="password" required="" type="password"/>
</div>
</div>
<button class="w-full min-h-touch-target-min bg-primary text-on-primary font-headline-sm text-headline-sm rounded-DEFAULT mt-8 hover:bg-primary-fixed transition-colors active:scale-[0.98] flex items-center justify-center" type="submit">
                        Σύνδεση
                    </button>
<div class="flex justify-center mt-6">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">
                            Ξέχασα τον κωδικό μου
                        </a>
</div>
</form>
<footer class="mt-12 w-full text-center border-t border-outline-variant pt-6">
<p class="font-code-sm text-code-sm text-outline">
                        SUPPORT: WHOLESALE@LUMIERE.COM<br/>
                        TEL: +30 210 123 4567
                    </p>
</footer>
</section>
<!-- SCREEN 1 VARIANT: RESET STATE -->
<section class="flex flex-col items-center justify-center w-full max-w-[440px] mx-auto bg-surface-container p-8 md:p-12 rounded-lg border border-outline-variant shadow-2xl shadow-black/50 opacity-90 lg:opacity-100">
<!-- Logo & Brand (Subdued for Variant) -->
<div class="flex flex-col items-center mb-8">
<span class="material-symbols-outlined text-on-surface-variant mb-4" style="font-size: 40px; font-variation-settings: 'wght' 300;">password</span>
<h2 class="font-headline-md text-headline-md tracking-tight text-center">Επαναφορά</h2>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8 px-4">
                    Αν ο αριθμός είναι καταχωρημένος, θα λάβεις νέο κωδικό.
                </p>
<!-- Reset Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="font-body-md text-body-md text-on-surface-variant block" for="reset-phone">Κινητό τηλέφωνο</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
<span class="material-symbols-outlined" style="font-size: 20px;">phone_iphone</span>
</span>
<input class="w-full min-h-touch-target-min bg-surface-dim border border-outline-variant rounded-DEFAULT pl-11 pr-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="reset-phone" inputmode="numeric" placeholder="69..." required="" type="tel"/>
</div>
</div>
<button class="w-full min-h-touch-target-min bg-surface-dim border border-outline-variant text-on-background font-headline-sm text-headline-sm rounded-DEFAULT mt-8 hover:border-primary hover:text-primary transition-colors active:scale-[0.98] flex items-center justify-center" type="submit">
                        Αποστολή νέου κωδικού
                    </button>
<div class="flex justify-center mt-6">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2" href="#">
<span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                            Επιστροφή στη σύνδεση
                        </a>
</div>
</form>
<footer class="mt-12 w-full text-center border-t border-outline-variant pt-6 lg:invisible">
<p class="font-code-sm text-code-sm text-outline">
                        SECURE STUDIO ACCESS
                    </p>
</footer>
</section>
</div>
</main>
</body></html>
