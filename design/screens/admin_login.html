<div class="flex flex-col gap-2">

<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-opacity-50">
                            lock
                        </span>

</div>
</div>
<button class="w-full h-touch-target-min bg-[#8b7bf0] text-[#f0efec] font-headline-sm text-headline-sm rounded flex items-center justify-center transition-opacity hover:opacity-90 active:scale-[0.98]" type="submit">

</form>
