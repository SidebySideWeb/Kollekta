<style>
        body { background-color: #14141a; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter h-touch-target-min bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant">
<div class="flex items-center gap-container-margin">
<span class="font-display-lg text-display-lg font-bold tracking-tighter text-on-surface dark:text-on-surface text-xl">Kollekta</span>
<div class="hidden md:flex gap-unit h-full">
<a class="text-on-surface-variant dark:text-on-surface-variant font-body-md text-body-md flex items-center h-full px-2 hover:text-primary dark:hover:text-primary transition-colors duration-200" href="#">Συλλογές</a>
<a class="text-primary dark:text-primary border-b-2 border-primary flex items-center h-full px-2 opacity-80 scale-95 transition-all" href="#">Πελάτες</a>
<a class="text-on-surface-variant dark:text-on-surface-variant font-body-md text-body-md flex items-center h-full px-2 hover:text-primary dark:hover:text-primary transition-colors duration-200" href="#">Μηνύματα</a>
<a class="text-on-surface-variant dark:text-on-surface-variant font-body-md text-body-md flex items-center h-full px-2 hover:text-primary dark:hover:text-primary transition-colors duration-200" href="#">Χώρος</a>
</div>
</div>
<div class="flex items-center gap-unit">
<button class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<div class="h-8 w-8 rounded-full bg-surface-variant border border-outline-variant overflow-hidden ml-2">
<img alt="Admin Profile Avatar" class="w-full h-full object-cover" data-alt="A minimalist vector avatar for a fashion admin profile. The avatar is rendered in high-end monochrome with sleek lines, against a dark studio background, embodying a technical, professional aesthetic suitable for a luxury wholesale platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxQQTx6othJmgdM-N_c1-xzQxje5xF7tMeAd98LoDnRayXaz-84kxaKDE8TEmAv098yKLYu8mPPsRvqhQgf3_OagYAE5BQ5TgE0sQaIlUZGb8KE9tCJzOH52pJiGi388da0A2nhOCxdYODZLU-w651bGXEMYZDiuzcG1kCXgSxySiJhOVNgHfUqkomrrhEjHs3QwPiZg0vS9s0bpyTlxHoilAsvy4Ni14KN8zfkKXB0eBBf6TiqKan"/>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[calc(44px+24px)] pb-safe-area-bottom px-gutter flex justify-center w-full">
<div class="w-full max-w-[900px] flex flex-col gap-container-margin">
<!-- Header Section -->
<header class="flex flex-col gap-unit">
<h1 class="font-headline-md text-headline-md text-on-surface">Ορατότητα & Επιλογή</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Καθορίστε ποιοι πελάτες θα έχουν πρόσβαση (Βήμα 4)</p>
</header>
<!-- Visibility Options Card -->
<section class="bg-surface-container border border-outline-variant rounded-lg p-container-margin flex flex-col gap-container-margin">
<div class="flex flex-col md:flex-row gap-container-margin">
<!-- Radio Option 1 -->
<label class="flex items-start gap-unit cursor-pointer group">
<div class="h-5 w-5 rounded-full border border-outline-variant flex items-center justify-center mt-0.5 group-hover:border-primary transition-colors">
<!-- Unselected state -->
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">Όλοι οι πελάτες</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">Ανοιχτή πρόσβαση σε όλο το δίκτυο.</span>
</div>
</label>
<!-- Radio Option 2 (Selected) -->
<label class="flex items-start gap-unit cursor-pointer group">
<div class="h-5 w-5 rounded-full border-2 border-primary flex items-center justify-center mt-0.5">
<div class="h-2.5 w-2.5 rounded-full bg-primary"></div>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-primary">Επιλεγμένοι πελάτες</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">Περιορισμένη πρόσβαση βάσει tags.</span>
</div>
</label>
</div>
<!-- Tag Selector Area -->
<div class="pt-unit border-t border-outline-variant">
<p class="font-label-caps text-label-caps text-on-surface-variant mb-unit">ΕΠΙΛΟΓΗ ΜΕΣΩ TAGS</p>
<div class="flex flex-wrap gap-2 mb-container-margin">
<!-- Selected Tags -->
<button class="flex items-center gap-1 bg-[#8b7bf0] text-[#131319] rounded-full px-3 py-1.5 h-8 transition-transform hover:scale-95 active:scale-90">
<span class="material-symbols-outlined text-[16px] icon-fill" data-icon="check_circle">check_circle</span>
<span class="font-body-md text-body-md font-semibold">χονδρική</span>
<span class="font-code-sm text-code-sm opacity-80 ml-1">180</span>
</button>
<button class="flex items-center gap-1 bg-[#8b7bf0] text-[#131319] rounded-full px-3 py-1.5 h-8 transition-transform hover:scale-95 active:scale-90">
<span class="material-symbols-outlined text-[16px] icon-fill" data-icon="check_circle">check_circle</span>
<span class="font-body-md text-body-md font-semibold">βόρεια-ελλάδα</span>
<span class="font-code-sm text-code-sm opacity-80 ml-1">64</span>
</button>
<button class="flex items-center gap-1 bg-[#8b7bf0] text-[#131319] rounded-full px-3 py-1.5 h-8 transition-transform hover:scale-95 active:scale-90">
<span class="material-symbols-outlined text-[16px] icon-fill" data-icon="check_circle">check_circle</span>
<span class="font-body-md text-body-md font-semibold">εταιρεία-α</span>
<span class="font-code-sm text-code-sm opacity-80 ml-1">120</span>
</button>
<!-- Unselected/Muted Tags -->
<button class="flex items-center gap-1 bg-[#26262f] border border-[#302f3a] text-on-surface rounded-full px-3 py-1.5 h-8 transition-colors hover:border-primary">
<span class="font-body-md text-body-md">outlet</span>
<span class="font-code-sm text-code-sm text-on-surface-variant ml-1">22</span>
</button>
<button class="flex items-center gap-1 bg-[#26262f] border border-[#302f3a] text-on-surface rounded-full px-3 py-1.5 h-8 transition-colors hover:border-primary">
<span class="font-body-md text-body-md">νέοι-πελάτες</span>
<span class="font-code-sm text-code-sm text-on-surface-variant ml-1">31</span>
</button>
</div>
<!-- Summary Line -->
<div class="bg-surface-variant rounded flex items-center p-unit gap-2">
<span class="material-symbols-outlined text-tertiary-fixed-dim" data-icon="info">info</span>
<p class="font-body-md text-body-md text-on-surface">Θα το δουν <span class="font-code-md text-code-md text-primary">184</span> από <span class="font-code-md text-code-md text-on-surface-variant">312</span> ενεργούς πελάτες.</p>
</div>
</div>
<!-- Collapsed Manual Selection -->
<div class="pt-unit border-t border-outline-variant mt-2">
<button class="w-full flex items-center justify-between py-2 text-on-surface hover:text-primary transition-colors group">
<span class="font-headline-sm text-headline-sm">Χειροκίνητη επιλογή πελατών</span>
<span class="material-symbols-outlined group-hover:-translate-y-0.5 transition-transform" data-icon="expand_more">expand_more</span>
</button>
</div>
</section>
<!-- Action Buttons -->
<div class="flex justify-end gap-gutter mt-container-margin">
<button class="h-[48px] px-6 bg-[#26262f] border border-[#302f3a] text-[#f0efec] font-body-lg text-body-lg rounded hover:bg-surface-variant transition-colors">
                    Πίσω
                </button>
<button class="h-[48px] px-6 bg-[#8b7bf0] text-[#f0efec] font-body-lg text-body-lg font-bold rounded hover:opacity-90 transition-opacity">
                    Ολοκλήρωση
                </button>
</div>
</div>
</main>
</body></html>
