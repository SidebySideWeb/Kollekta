<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Σύνδεση</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1 id="login-title">Kollekta</h1>
      <p class="subtitle" id="login-subtitle">Σύνδεση διαχειριστή</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@company.com" required autocomplete="username">
        <label for="password">Κωδικός πρόσβασης</label>
        <input type="password" id="password" placeholder="Κωδικός" required autocomplete="current-password">
        <p id="login-error" class="status-line error hidden"></p>
        <button type="submit" class="btn btn-primary login-submit">Σύνδεση</button>
        <button type="button" class="link-btn" id="forgot-btn">Ξέχασα τον κωδικό μου</button>
      </form>

      <div id="forgot-form" class="hidden">
        <p class="reset-intro">Θα σταλεί κωδικός επαναφοράς στο email του διαχειριστή.</p>
        <label for="forgot-email">Email</label>
        <input type="email" id="forgot-email" placeholder="name@company.com" required autocomplete="username">
        <p id="forgot-msg" class="status-line hidden"></p>
        <button type="button" class="btn btn-primary login-submit" id="forgot-send-btn">Αποστολή κωδικού</button>
        <button type="button" class="btn btn-secondary login-submit" id="forgot-have-code-btn">Έχω κωδικό</button>
        <button type="button" class="link-btn" id="back-login-btn">← Επιστροφή στη σύνδεση</button>
      </div>

      <form id="reset-form" class="hidden">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" placeholder="name@company.com" required autocomplete="username">
        <label for="reset-code">Κωδικός επαναφοράς</label>
        <input type="text" id="reset-code" class="code-input" placeholder="Κωδικός από email" required autocomplete="one-time-code">
        <label for="reset-new-password">Νέος κωδικός</label>
        <input type="password" id="reset-new-password" required minlength="8" autocomplete="new-password">
        <label for="reset-confirm-password">Επιβεβαίωση</label>
        <input type="password" id="reset-confirm-password" required minlength="8" autocomplete="new-password">
        <p id="reset-error" class="status-line error hidden"></p>
        <button type="submit" class="btn btn-primary login-submit">Ορισμός νέου κωδικού</button>
        <button type="button" class="link-btn" id="back-forgot-btn">← Πίσω</button>
      </form>
    </div>
  </div>
  <script>
    let resetAvailable = false;

    function showPanel(name) {
      document.getElementById('login-form').classList.toggle('hidden', name !== 'login');
      document.getElementById('forgot-form').classList.toggle('hidden', name !== 'forgot');
      document.getElementById('reset-form').classList.toggle('hidden', name !== 'reset');
      document.getElementById('login-subtitle').textContent =
        name === 'login' ? 'Σύνδεση διαχειριστή' : name === 'forgot' ? 'Επαναφορά κωδικού' : 'Νέος κωδικός';
    }

    fetch('/api/branding').then(r => r.json()).then(b => {
      document.documentElement.style.setProperty('--accent', b.accentColor || '#8b7bf0');
      if (b.storageWarnPercent) {
        document.documentElement.style.setProperty('--storage-warn-percent', b.storageWarnPercent);
      }
      if (b.storageCriticalPercent) {
        document.documentElement.style.setProperty('--storage-critical-percent', b.storageCriticalPercent);
      }
      document.getElementById('login-title').textContent = b.companyName || 'Kollekta';
      document.title = (b.companyName || 'Kollekta') + ' — Σύνδεση';
      resetAvailable = Boolean(b.adminResetAvailable);
      document.getElementById('forgot-btn').classList.toggle('hidden', !resetAvailable);
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('login-error');
      err.classList.add('hidden');
      const email = document.getElementById('email').value.trim();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email,
          password: document.getElementById('password').value,
        }),
      });
      if (!res.ok) {
        err.textContent = 'Λάθος email ή κωδικός.';
        err.classList.remove('hidden');
        return;
      }
      try { localStorage.setItem('pd_admin_email', email); } catch (_) {}
      location.href = '/admin/';
    });

    try {
      const saved = localStorage.getItem('pd_admin_email');
      if (saved) document.getElementById('email').value = saved;
    } catch (_) {}

    document.getElementById('forgot-btn').addEventListener('click', () => {
      document.getElementById('forgot-msg').classList.add('hidden');
      const email = document.getElementById('email').value.trim();
      if (email) document.getElementById('forgot-email').value = email;
      showPanel('forgot');
    });
    document.getElementById('back-login-btn').addEventListener('click', () => showPanel('login'));
    document.getElementById('back-forgot-btn').addEventListener('click', () => showPanel('forgot'));
    document.getElementById('forgot-have-code-btn').addEventListener('click', () => {
      document.getElementById('reset-error').classList.add('hidden');
      const email = document.getElementById('forgot-email').value.trim() || document.getElementById('email').value.trim();
      if (email) document.getElementById('reset-email').value = email;
      showPanel('reset');
    });

    document.getElementById('forgot-send-btn').addEventListener('click', async () => {
      const msg = document.getElementById('forgot-msg');
      const email = document.getElementById('forgot-email').value.trim();
      if (!email) {
        msg.className = 'status-line error';
        msg.textContent = 'Συμπλήρωσε το email.';
        msg.classList.remove('hidden');
        return;
      }
      msg.className = 'status-line';
      msg.textContent = 'Αποστολή...';
      msg.classList.remove('hidden');
      const res = await fetch('/api/admin-auth/forgot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));
      msg.textContent = data.message || data.error || 'Ολοκληρώθηκε.';
      msg.className = res.ok ? 'status-line success' : 'status-line error';
      if (res.ok) {
        document.getElementById('reset-email').value = email;
        showPanel('reset');
      }
    });

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('reset-error');
      err.classList.add('hidden');
      const email = document.getElementById('reset-email').value.trim();
      const newPassword = document.getElementById('reset-new-password').value;
      const confirm = document.getElementById('reset-confirm-password').value;
      if (newPassword !== confirm) {
        err.textContent = 'Οι κωδικοί δεν ταιριάζουν.';
        err.classList.remove('hidden');
        return;
      }
      const res = await fetch('/api/admin-auth/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email,
          code: document.getElementById('reset-code').value,
          newPassword,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.error || 'Αποτυχία επαναφοράς.';
        err.classList.remove('hidden');
        return;
      }
      alert(data.message || 'Ο κωδικός ενημερώθηκε.');
      document.getElementById('email').value = email;
      showPanel('login');
      document.getElementById('password').value = '';
    });
  </script>
</body>
</html>
